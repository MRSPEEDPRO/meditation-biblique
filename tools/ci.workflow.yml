name: Construction et tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: index.html — build + 337 vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer jsdom
        run: npm install --no-audit --no-fund

      - name: Assembler index.html
        run: python3 build.py

      - name: Vérifier que index.html est à jour
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html n'est pas à jour : lancez « python3 build.py » et committez le résultat."
            git diff --stat -- index.html
            exit 1
          fi

      - name: Tests automatiques
        run: npm test

      - name: Autonomie du fichier (aucune ressource externe)
        run: |
          if grep -Eq '<script[^>]+src=|<link[^>]+stylesheet' index.html; then
            echo "::error::index.html référence une ressource externe."
            exit 1
          fi
          echo "✅ index.html est autonome"
